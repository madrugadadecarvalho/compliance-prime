name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_prime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance_prime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://compliance:compliance@localhost:5432/compliance_prime
      BETTER_AUTH_SECRET: ci-secret-nao-usar-em-producao-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      ALLOW_SIGNUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrações e dados de demonstração
        run: |
          printf 'DATABASE_URL=%s\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=%s\nALLOW_SIGNUP=true\n' "$DATABASE_URL" "$BETTER_AUTH_SECRET" "$BETTER_AUTH_URL" > .env
          npm run db:setup
      - run: npm run build
      - name: Testes ponta-a-ponta
        run: |
          npx playwright install --with-deps chromium
          npm start &
          npx wait-on http://localhost:3000/entrar --timeout 60000
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
